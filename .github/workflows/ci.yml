name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Least privilege: CI only reads the repo; no workflow uses secrets or writes.
permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # No third-party toolchain action: the runner image already ships rustup,
      # and pulling `dtolnay/rust-toolchain` from codeload made CI fail twice on
      # 2026-08-17 with HTTP 429 before a single line of our code ran. Two lines
      # of rustup remove that failure mode and one more third party from the
      # chain — the same reasoning that made every remaining action SHA-pinned.
      - name: Rust toolchain (stable + fmt + clippy)
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (commit, not the tag object)
      # keyring's sync-secret-service backend links against libdbus on Linux.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  node:
    name: Node (subscription-kit smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: subscription-kit install
        working-directory: apps/subscription-kit
        run: npm ci
      - name: subscription-kit tests (panel escape + offline smoke)
        working-directory: apps/subscription-kit
        run: npm test
