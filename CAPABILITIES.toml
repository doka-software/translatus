# CAPABILITIES.toml — single source of truth for user-visible capabilities.
# Governance: capability parity between the CLI and any GUI host embedding the engine.
#
# WHAT BELONGS HERE (inclusion criteria):
#   A capability is listed when it is user-visible AND routed through the core
#   engine — i.e. it touches `TranslateConfig` (crates/core/src/config.rs) or a
#   CLI command/flag. Host-side features that never pass through core config
#   (window chrome, onboarding, interface language…) belong to the host's own
#   capability map and are deliberately NOT declared here.
#
# SCHEMA (enforced by apps/cli/src/parity_tests.rs — run `cargo test -p translatus`):
#   id       unique kebab-case name.
#   since    workspace version that first shipped the capability.
#   surfaces subset of ["cli","gui"]. If a surface is deliberately missing,
#            `reason` is REQUIRED (intentional asymmetry must be explicit;
#            silent drift is a test failure).
#   config   TranslateConfig field names this capability owns. The union across
#            all capabilities must equal the full TranslateConfig key set —
#            adding a config field without declaring a capability is a red test.
#   cli      required when surfaces contains "cli": the subcommands and flags
#            that expose it. Each command must exist; each flag must exist on
#            at least one listed command (or globally). Declared-but-missing
#            flags are a red test.
#   tests    test-function anchors (must exist somewhere under crates/ or
#            apps/); a capability ships with tests or it doesn't ship.

[[capability]]
id       = "translate-standard"
since    = "1.0.0"
surfaces = ["cli", "gui"]
config   = ["target_lang", "level", "max_batch_sentences", "max_chunk_tokens"]
cli      = { commands = ["translate"], flags = ["--to", "--level", "--output"] }
tests    = [
  "translate_plus_annotate_bilingual_end_to_end",
  "accepts_valid",
  "respects_unit_cap",
]

[[capability]]
id       = "translate-expert"
since    = "1.0.0"
surfaces = ["cli", "gui"]
config   = ["level"]
cli      = { commands = ["translate"], flags = ["--level"] }
tests    = [
  "bake_glossary_makes_target_self_contained",
  "consistency_flags_term_misuse",
  "reflect_response_validation_uses_draft_placeholders",
]

[[capability]]
id       = "annotate"
since    = "1.0.0"
surfaces = ["cli", "gui"]
config   = ["annotations"]
cli      = { commands = ["annotate", "translate"], flags = ["--annotate", "--profile", "--density", "--note-lang", "--note-style", "--note-presets", "--note-profile", "--note-anchors", "--note-voice", "--note-level"] }
tests    = [
  "annotate_only_epub_end_to_end",
  "translate_plus_annotate_bilingual_end_to_end",
  "chapter_cap_trims_greedy_model_by_priority",
  "before_and_after_placements_end_to_end",
  "note_style_injected_into_n1_and_n2",
  "preset_guidance_injected_into_selection_and_notes",
  "annotation_presets_enter_signature_only_canonically",
  "anchors_injected_into_plan_selection_and_notes",
  "anchors_and_voice_enter_annotation_signature_only",
  "voice_selects_default_style_and_custom_style_wins",
  "plan_block_carries_thread_map",
  "reader_addressing_notes_are_rejected_at_both_chokepoints",
  "reader_profile_contract_parses_and_rejects_unknown_keys",
  "note_profile_over_mcp_must_be_inline_json",
  "explain_level_injected_and_profile_optional",
  "explain_level_enters_annotation_signature_only",
  "service_menu_covers_world_methods_research",
]

