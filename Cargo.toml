[workspace]
resolver = "2"
members = ["crates/core", "apps/cli"]

[workspace.package]
version = "1.1.2"
edition = "2021"
license = "MIT"
authors = ["doka.software"]
repository = "https://github.com/doka-software/translatus"
description = "Translatus — from any book, to your book. Open-source ebook translation and margin-note engine and CLI."

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "io-std", "io-util", "process", "sync"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
quick-xml = "0.41"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
unicode-width = "0.2"
toml = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
