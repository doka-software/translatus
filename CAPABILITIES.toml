cli      = { commands = ["translate"], flags = ["--prompt"] }
tests    = ["cache_signature_is_stable_and_sensitive"]

[[capability]]
id       = "cache-resume"
since    = "1.0.0"
surfaces = ["cli", "gui"]
config   = []
cli      = { commands = ["translate", "annotate"], flags = ["--job"] }
tests    = [
  "cache_persists_and_resume_restores",
  "batch_checkpoint_resumes_mid_chapter",
]

[[capability]]
id       = "cache-only-rerender"
since    = "1.0.0"
surfaces = ["cli", "gui"]
config   = []
cli      = { commands = ["translate", "annotate"], flags = ["--cache-only"] }
tests    = ["annotate_only_epub_end_to_end"]

[[capability]]
id       = "estimate"
since    = "1.0.0"
surfaces = ["cli", "gui"]
config   = []
cli      = { commands = ["estimate"], flags = ["--to", "--level", "--model", "--annotate", "--density"] }
tests    = ["gpt5_mini_priced_and_not_shadowed_by_bare_5_4"]

[[capability]]
id       = "concurrency"
since    = "1.0.0"
surfaces = ["cli"]
reason   = "Throughput tuning for direct-API agent runs. The GUI deliberately keeps the safe sequential default: subscription-style backends are heavy and rate-limit-prone under parallel batches."
config   = ["concurrency"]
cli      = { commands = ["translate"], flags = ["--concurrency"] }
tests    = ["concurrency_matches_sequential"]

[[capability]]
id       = "json-output"
since    = "1.0.0"
surfaces = ["cli"]
reason   = "Machine-readable stdout events are the agent interface; the GUI renders the same progress events visually instead."
config   = []
cli      = { commands = [], flags = ["--json"] }
tests    = ["json_flag_is_global"]

[[capability]]
id       = "live-read-along"
since    = "1.0.0"
surfaces = ["gui"]
reason   = "The streaming read-along preview is a windowed reading surface; the CLI reports the same batch/chapter progress as JSON lines (see json-output) rather than rendering pages."
config   = []
tests    = ["batch_checkpoint_resumes_mid_chapter"]

[[capability]]
id       = "mcp-server"
since    = "1.0.0"
surfaces = ["cli"]
reason   = "The MCP server IS the agent surface of the CLI (tools = the CLI's own commands over stdio). The GUI is the human surface; agents connect through `translatus mcp` or --json instead of driving a GUI."
config   = []
cli      = { commands = ["mcp", "mcp install", "mcp uninstall"], flags = [] }
tests    = [
  "mcp_handshake_tools_list_and_mock_estimate",
  "mcp_translate_streams_progress_and_writes_output",
  "mcp_caps_paid_book_jobs_while_estimates_remain_available",
  "mcp_tool_schemas_are_wellformed",
  "mcp_schemas_never_accept_secrets_or_arbitrary_write_paths",
  "build_argv_maps_params_to_cli_flags",
  # The return surface is a trust boundary: the caller is an agent with tools,
  # so book text crossing back is injection, not just noise. See SECURITY-REVIEW §3.
  "mcp_results_never_carry_book_content",
  "mcp_errors_never_return_subprocess_output",
  "tool_results_allowlist_metadata_and_drop_model_text",
  "progress_omits_book_controlled_fields",
  "ambient_credentials_can_be_disabled_without_touching_keychain_or_env",
  "scoped_endpoint_token_requires_exact_operator_configured_url",
  "target_language_cannot_escape_the_input_directory",
]
